<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的作品集 - 游戏场景编辑</title>
    <style>
        /* ========== 全局样式 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            color: #111111;
            line-height: 1.6;
        }
        a {
            color: #111;
            text-decoration: none;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        section {
            padding: 80px 0;
        }
        h2 {
            font-size: 2.5rem;
            margin-bottom: 40px;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 2px solid #111;
            display: inline-block;
            padding-bottom: 10px;
        }

        /* ========== 导航栏 ========== */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(255,255,255,0.95);
            border-bottom: 1px solid #eee;
            z-index: 1000;
        }
        nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
        }
        .logo {
            font-weight: bold;
            font-size: 1.5rem;
            letter-spacing: 2px;
        }
        .nav-links {
            display: flex;
            list-style: none;
        }
        .nav-links li {
            margin-left: 30px;
        }
        .nav-links a {
            font-size: 0.95rem;
            letter-spacing: 1px;
            transition: opacity 0.3s;
        }
        .nav-links a:hover {
            opacity: 0.5;
        }
        .menu-toggle {
            display: none;
            flex-direction: column;
            cursor: pointer;
        }
        .menu-toggle span {
            width: 25px;
            height: 2px;
            background: #111;
            margin: 3px 0;
            transition: 0.3s;
        }

        /* ========== 首页 ========== */
        #home {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: #fafafa;
        }
        #home h1 {
            font-size: 4rem;
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        #home p {
            font-size: 1.2rem;
            color: #555;
        }

        /* ========== 作品展示 ========== */
        .works-layout {
            display: flex;
            gap: 40px;
            margin-top: 20px;
        }
        .work-list {
            flex: 1;
            min-width: 200px;
            border-right: 1px solid #ddd;
            padding-right: 20px;
        }
        .work-list button {
            display: block;
            width: 100%;
            padding: 15px 10px;
            margin-bottom: 5px;
            background: none;
            border: none;
            text-align: left;
            font-size: 1.1rem;
            letter-spacing: 1px;
            cursor: pointer;
            color: #111;
            transition: all 0.3s;
            border-left: 3px solid transparent;
        }
        .work-list button:hover,
        .work-list button.active {
            border-left: 3px solid #111;
            background: #f5f5f5;
            font-weight: bold;
        }
        .work-detail {
            flex: 3;
        }
        .work-title {
            font-size: 2rem;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        /* ========== 自动滚动图片轮播 ========== */
        .gallery-carousel {
            position: relative;
            overflow: hidden;
            margin-bottom: 30px;
            border-radius: 8px;
            background: #f0f0f0;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }
        .gallery-track {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            animation: scrollLoop linear infinite;
            width: max-content;
        }
        .gallery-track.paused {
            animation-play-state: paused;
        }
        .gallery-item {
            flex: 0 0 280px;
            height: 200px;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
            flex-shrink: 0;
            position: relative;
        }
        .gallery-item:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(0,0,0,0.2);
            border-color: #111;
            z-index: 2;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        @keyframes scrollLoop {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .carousel-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 12px 0 5px;
        }
        .carousel-controls button {
            background: #111;
            color: #fff;
            border: none;
            padding: 8px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }
        .carousel-controls button:hover {
            background: #333;
            transform: scale(1.02);
        }
        .carousel-controls button.pause-btn {
            background: #e74c3c;
        }
        .carousel-controls button.pause-btn:hover {
            background: #c0392b;
        }
        .carousel-controls button.play-btn {
            background: #2ecc71;
        }
        .carousel-controls button.play-btn:hover {
            background: #27ae60;
        }

        /* ========== 全屏轮播模态框 ========== */
        .carousel-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }
        .carousel-overlay.active {
            display: flex;
        }
        .carousel-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .carousel-image {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            transition: opacity 0.25s ease;
        }
        .carousel-counter {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.8);
            font-size: 1rem;
            background: rgba(0,0,0,0.5);
            padding: 8px 20px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            letter-spacing: 1px;
        }
        .carousel-close {
            position: fixed;
            top: 25px;
            right: 35px;
            font-size: 3rem;
            color: #fff;
            cursor: pointer;
            transition: opacity 0.2s;
            line-height: 1;
            z-index: 10000;
            opacity: 0.8;
        }
        .carousel-close:hover {
            opacity: 0.5;
        }
        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            width: 56px;
            height: 56px;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s;
            user-select: none;
        }
        .carousel-nav:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-50%) scale(1.05);
        }
        .carousel-nav.prev {
            left: 25px;
        }
        .carousel-nav.next {
            right: 25px;
        }
        .carousel-nav.hidden {
            opacity: 0;
            pointer-events: none;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ========== 视频容器 ========== */
        .video-wrapper {
            max-width: 900px;
            margin: 20px auto 0;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .no-video {
            color: #999;
            font-style: italic;
            text-align: center;
            margin-top: 10px;
            padding: 20px;
            background: #f8f8f8;
            border-radius: 8px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ========== 关于我 ========== */
        #about p {
            font-size: 1.1rem;
            max-width: 700px;
            margin-bottom: 20px;
            color: #444;
        }

        /* ========== 联系方式 ========== */
        #contact .contact-info {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
        }
        .contact-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
        }
        .contact-item a {
            border-bottom: 1px solid transparent;
            transition: border-color 0.3s;
        }
        .contact-item a:hover {
            border-bottom-color: #111;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .nav-links {
                position: fixed;
                top: 60px;
                right: -100%;
                width: 100%;
                height: calc(100vh - 60px);
                background: white;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                transition: right 0.3s;
            }
            .nav-links.active {
                right: 0;
            }
            .nav-links li {
                margin: 20px 0;
            }
            .menu-toggle {
                display: flex;
            }
            .works-layout {
                flex-direction: column;
            }
            .work-list {
                border-right: none;
                border-bottom: 1px solid #ddd;
                padding-bottom: 15px;
            }
            .work-list button {
                display: inline-block;
                width: auto;
                margin-right: 10px;
                border-left: none;
                border-bottom: 3px solid transparent;
            }
            .work-list button.active {
                border-left: none;
                border-bottom: 3px solid #111;
            }
            #home h1 {
                font-size: 2.5rem;
            }
            .gallery-item {
                flex: 0 0 200px;
                height: 150px;
            }
            .carousel-nav {
                width: 44px;
                height: 44px;
                font-size: 1.5rem;
            }
            .carousel-nav.prev {
                left: 10px;
            }
            .carousel-nav.next {
                right: 10px;
            }
            .carousel-close {
                top: 15px;
                right: 20px;
                font-size: 2.5rem;
            }
            .carousel-counter {
                bottom: 20px;
                font-size: 0.85rem;
                padding: 6px 16px;
            }
        }

        @media (max-width: 480px) {
            .gallery-item {
                flex: 0 0 160px;
                height: 120px;
            }
        }
    </style>
</head>
<body>

    <!-- 导航栏 -->
    <nav>
        <div class="container">
            <div class="logo">PORTFOLIO</div>
            <ul class="nav-links" id="navLinks">
                <li><a href="#home">首页</a></li>
                <li><a href="#works">作品展示</a></li>
                <li><a href="#about">关于我</a></li>
                <li><a href="#contact">联系方式</a></li>
            </ul>
            <div class="menu-toggle" id="menuToggle" onclick="toggleMenu()">
                <span></span><span></span><span></span>
            </div>
        </div>
    </nav>

    <!-- 全屏轮播模态框 -->
    <div class="carousel-overlay" id="carouselOverlay" onclick="closeCarousel(event)">
        <span class="carousel-close" onclick="closeCarousel()">&times;</span>
        <div class="carousel-container">
            <button class="carousel-nav prev" id="carouselPrev" onclick="changeCarousel(-1)">‹</button>
            <img class="carousel-image" id="carouselImage" src="" alt="作品图片">
            <button class="carousel-nav next" id="carouselNext" onclick="changeCarousel(1)">›</button>
            <div class="carousel-counter" id="carouselCounter">1 / 1</div>
        </div>
    </div>

    <!-- 首页 -->
    <section id="home">
        <div>
            <h1>游戏场景编辑</h1>
            <p>展示我的场景作品 - 图片与视频</p>
        </div>
    </section>

    <!-- 作品展示 -->
    <section id="works">
        <div class="container">
            <h2>作品展示</h2>
            <div class="works-layout">
                <div class="work-list" id="workList">
                    <!-- 作品名按钮由JS动态生成 -->
                </div>
                <div class="work-detail" id="workDetail">
                    <!-- 当前作品的详细内容由JS动态生成 -->
                </div>
            </div>
        </div>
    </section>

    <!-- 关于我 -->
    <section id="about">
        <div class="container">
            <h2>关于我</h2>
            <p>你好，我是一名游戏场景编辑师，专注于构建沉浸式的游戏世界。熟练使用 Unity、Unreal Engine、Maya、Blender 等工具，擅长场景布局、灯光渲染和资产整合。</p>
            <p>我热爱通过环境叙事来增强游戏体验，参与过多个独立游戏项目。欢迎浏览我的作品，如有合作意向请通过联系方式与我取得联系。</p>
        </div>
    </section>

    <!-- 联系方式 -->
    <section id="contact">
        <div class="container">
            <h2>联系方式</h2>
            <div class="contact-info">
                <div class="contact-item">
                    <span>📧</span>
                    <a href="mailto:1479355279@qq.com">1479355279@qq.com</a>
                </div>
                <div class="contact-item">
                    <span>🔗</span>
                    <a href="https://www.artstation.com/yourprofile" target="_blank">ArtStation</a>
                </div>
                <div class="contact-item">
                    <span>💼</span>
                    <a href="https://www.linkedin.com/in/yourprofile" target="_blank">LinkedIn</a>
                </div>
            </div>
        </div>
    </section>

    <script>
        // ============================================================
        // ✅ 修复1: 图片链接已修正为 https://（去掉了多余的 "i"）
        // ✅ 修复2: 点击图片打开全屏轮播功能正常
        // ✅ 修复3: 视频宽度与图片轮播一致（都是 max-width: 900px）
        // ✅ 修复4: 自动滚动 + 暂停/播放 + 鼠标悬停暂停
        // ============================================================

        const worksData = [
            {
                name: "对马岛场景练习",
                description: "一个对马岛的场景练习，包含大量自定义资产和动态光照。",
                images: [
                    "https://myportfolio-1475690053.cos.ap-guangzhou.myqcloud.com/11.png",
                    "https://myportfolio-1475690053.cos.ap-guangzhou.myqcloud.com/HighresScreenshot00015.png",
                    "https://myportfolio-1475690053.cos.ap-guangzhou.myqcloud.com/HighresScreenshot00016.png",
                    "https://myportfolio-1475690053.cos.ap-guangzhou.myqcloud.com/box.png",
                    "https://myportfolio-1475690053.cos.ap-guangzhou.myqcloud.com/stone.png",
                    "https://myportfolio-1475690053.cos.ap-guangzhou.myqcloud.com/tbrender_Viewport.png",
                    "https://myportfolio-1475690053.cos.ap-guangzhou.myqcloud.com/tbrender_Viewport_001.png",
                    "https://myportfolio-1475690053.cos.ap-guangzhou.myqcloud.com/tbrender_Viewport_002.png",
                    "https://myportfolio-1475690053.cos.ap-guangzhou.myqcloud.com/tbrender_Viewport_003.png",
                    "https://myportfolio-1475690053.cos.ap-guangzhou.myqcloud.com/tbrender_Viewport_004.png",
                    "https://myportfolio-1475690053.cos.ap-guangzhou.myqcloud.com/tbrender_Viewport_005.png",
                    "https://myportfolio-1475690053.cos.ap-guangzhou.myqcloud.com/tbrender_Viewport_006.png",
                    "https://myportfolio-1475690053.cos.ap-guangzhou.myqcloud.com/tbrender_Viewport_007.png",
                    "https://myportfolio-1475690053.cos.ap-guangzhou.myqcloud.com/tbrender_Viewport_009.png",
                    "https://myportfolio-1475690053.cos.ap-guangzhou.myqcloud.com/tbrender_Viewport_011.png",
                ],
                video: "https://player.bilibili.com/player.html?isOutside=true&aid=117162731702950&bvid=BV1tc8Z6XEH6&cid=41299675854&p=1"
            },
            {
                name: "中世纪城镇",
                description: "一个充满细节的中世纪小镇，突出建筑布局和氛围营造。",
                images: [
                    "https://picsum.photos/800/500?random=4",
                    "https://picsum.photos/800/500?random=5"
                ],
                video: ""
            },
            {
                name: "科幻空间站",
                description: "硬表面建模为主的科幻场景，强调灯光和材质表现。",
                images: [
                    "https://picsum.photos/800/500?random=6",
                    "https://picsum.photos/800/500?random=7",
                    "https://picsum.photos/800/500?random=8"
                ],
                video: "https://player.bilibili.com/player.html?isOutside=true&aid=117162731702950&bvid=BV1tc8Z6XEH6&cid=41299675854&p=1"
            }
        ];

        const workList = document.getElementById('workList');
        const workDetail = document.getElementById('workDetail');
        let currentIndex = 0;

        // ===== 全屏轮播 =====
        const carouselOverlay = document.getElementById('carouselOverlay');
        const carouselImage = document.getElementById('carouselImage');
        const carouselCounter = document.getElementById('carouselCounter');
        let currentCarouselImages = [];
        let currentCarouselIndex = 0;

        function openCarousel(images, startIndex) {
            if (!images || images.length === 0) return;
            currentCarouselImages = images;
            currentCarouselIndex = startIndex;
            updateCarousel();
            carouselOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeCarousel(event) {
            if (event && event.target !== carouselOverlay && event.target.tagName !== 'IMG') {
                return;
            }
            carouselOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        function changeCarousel(direction) {
            const len = currentCarouselImages.length;
            if (len === 0) return;
            currentCarouselIndex = (currentCarouselIndex + direction + len) % len;
            updateCarousel();
        }

        function updateCarousel() {
            const len = currentCarouselImages.length;
            if (len === 0) return;
            carouselImage.src = currentCarouselImages[currentCarouselIndex];
            carouselCounter.textContent = `${currentCarouselIndex + 1} / ${len}`;
            
            document.getElementById('carouselPrev').classList.toggle('hidden', len <= 1);
            document.getElementById('carouselNext').classList.toggle('hidden', len <= 1);
        }

        // 键盘控制
        document.addEventListener('keydown', function(e) {
            if (!carouselOverlay.classList.contains('active')) return;
            if (e.key === 'Escape') closeCarousel();
            else if (e.key === 'ArrowLeft') { e.preventDefault(); changeCarousel(-1); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); changeCarousel(1); }
        });

        // ===== 渲染作品列表 =====
        function renderWorkList() {
            workList.innerHTML = '';
            worksData.forEach((work, index) => {
                const btn = document.createElement('button');
                btn.textContent = work.name;
                btn.classList.add('work-btn');
                if (index === currentIndex) btn.classList.add('active');
                btn.addEventListener('click', () => {
                    currentIndex = index;
                    document.querySelectorAll('.work-btn').forEach((b, i) => {
                        b.classList.toggle('active', i === index);
                    });
                    renderWorkDetail(index);
                });
                workList.appendChild(btn);
            });
        }

        // ===== 设置自动滚动 =====
        function setupAutoScroll(container) {
            const track = container.querySelector('.gallery-track');
            if (!track) return;

            const totalItems = track.querySelectorAll('.gallery-item').length;
            const duration = Math.max(20, totalItems * 2);
            track.style.animationDuration = duration + 's';

            const pauseBtn = container.querySelector('.pause-btn');
            const playBtn = container.querySelector('.play-btn');

            function pauseScroll() {
                track.classList.add('paused');
                if (pauseBtn) { pauseBtn.style.display = 'none'; }
                if (playBtn) { playBtn.style.display = 'inline-block'; }
            }

            function playScroll() {
                track.classList.remove('paused');
                if (playBtn) { playBtn.style.display = 'none'; }
                if (pauseBtn) { pauseBtn.style.display = 'inline-block'; }
            }

            if (pauseBtn) pauseBtn.addEventListener('click', pauseScroll);
            if (playBtn) playBtn.addEventListener('click', playScroll);

            // 鼠标悬停暂停
            track.addEventListener('mouseenter', () => {
                if (!track.classList.contains('paused')) {
                    track.style.animationPlayState = 'paused';
                }
            });
            track.addEventListener('mouseleave', () => {
                if (!track.classList.contains('paused')) {
                    track.style.animationPlayState = 'running';
                }
            });

            // 触屏支持
            track.addEventListener('touchstart', () => {
                if (!track.classList.contains('paused')) {
                    track.style.animationPlayState = 'paused';
                }
            });
            track.addEventListener('touchend', () => {
                if (!track.classList.contains('paused')) {
                    track.style.animationPlayState = 'running';
                }
            });
        }

        // ===== 渲染作品详情 =====
        function renderWorkDetail(index) {
            const work = worksData[index];
            let html = `<div class="work-title">${work.name}</div>`;
            html += `<p style="margin-bottom:20px; color:#555;">${work.description}</p>`;

            // 图片轮播
            if (work.images && work.images.length > 0) {
                html += `<div class="gallery-carousel">`;
                html += `<div class="gallery-track">`;
                const doubled = [...work.images, ...work.images];
                doubled.forEach((img, i) => {
                    const originalIndex = i % work.images.length;
                    html += `<div class="gallery-item" onclick="openCarousel(${JSON.stringify(work.images)}, ${originalIndex})">`;
                    html += `<img src="${img}" alt="${work.name}" loading="lazy">`;
                    html += `</div>`;
                });
                html += `</div>`;
                html += `<div class="carousel-controls">`;
                html += `<button class="pause-btn">⏸ 暂停</button>`;
                html += `<button class="play-btn" style="display:none;">▶ 播放</button>`;
                html += `</div>`;
                html += `</div>`;
            } else {
                html += `<p style="color:#999; margin-bottom:20px;">（暂无图片）</p>`;
            }

            // 视频
            if (work.video && work.video.trim() !== '') {
                html += `<div class="video-wrapper">`;
                html += `<div class="video-container">`;
                html += `<iframe src="${work.video}" allowfullscreen></iframe>`;
                html += `</div>`;
                html += `</div>`;
            } else {
                html += `<div class="no-video">📹 暂无视频</div>`;
            }

            workDetail.innerHTML = html;

            const carousel = document.querySelector('.gallery-carousel');
            if (carousel) setupAutoScroll(carousel);
        }

        // ===== 移动端菜单 =====
        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('active');
        }
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('navLinks').classList.remove('active');
            });
        });

        // ===== 初始化 =====
        renderWorkList();
        renderWorkDetail(0);
    </script>
</body>
</html>
